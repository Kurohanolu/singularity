name: Pre14 public acceptance
on:
  workflow_run:
    workflows: [Deploy verified Singularity]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Read deployed source request
        id: source
        run: |
          node -e "const fs=require('node:fs'),a=require('node:assert/strict'),r=require('./deployment-request.json');a.match(r.source_sha,/^[a-f0-9]{40}$/);fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+r.source_sha+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: Kurohanolu/chloha-damage-lab
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact public bytes and record acceptance
        env:
          SINGULARITY_DEPLOYMENT_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          node -e "require('node:assert/strict').equal(require('./release.json').tag,'v1.1.0-pre.14')"
          node -e "const r=require('./release.json');require('node:child_process').execFileSync(process.execPath,['scripts/v100-live-acceptance.cjs',r.migration.liveTargetVerified?'--publication':'--record-preacceptance'],{stdio:'inherit'})"
          node -e "const fs=require('node:fs');for(const p of ['reports/v100/live-acceptance-receipt.json','reports/v100/live-public-assets.json'])if(fs.existsSync(p))console.log('EVIDENCE_JSON '+p+' '+JSON.stringify(JSON.parse(fs.readFileSync(p))))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre14-live-acceptance
          path: reports/v100/
          if-no-files-found: error
