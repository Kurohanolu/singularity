name: Deploy verified Singularity public files
on:
  push:
    branches: [main]
    paths: [deployment-request.json]
permissions:
  contents: read
concurrency:
  group: singularity-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public tree and GitHub-generated archives
        run: |
          python3 .github/scripts/verify-public-bundle.py --github-archives --stage "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify live deployment bytes
        run: python3 .github/scripts/verify-public-bundle.py --live
